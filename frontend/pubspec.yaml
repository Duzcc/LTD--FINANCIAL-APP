name: finance_app
description: Ứng dụng quản lý tài chính cá nhân
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  image_picker: ^1.2.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  speech_to_text: ^7.3.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.0.0
  app_links: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_256.png
    - assets/branding/ai_assistant_256.png
    - assets/branding/ai_assistant_avatar_256.png
  # Roboto có đủ dấu tiếng Việt, đóng gói sẵn cho iOS và Web
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
