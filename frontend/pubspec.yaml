name: finance_app
description: Ứng dụng quản lý tài chính cá nhân
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.2
  http: ^1.2.2
  crypto: ^3.0.6
  archive: ^4.0.7
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  image_picker: ^1.2.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  speech_to_text: ^7.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Đóng gói font Roboto (có đủ dấu tiếng Việt) để iOS và Web hiển thị giống thiết kế,
  # Web không phụ thuộc CDN font của Google.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
